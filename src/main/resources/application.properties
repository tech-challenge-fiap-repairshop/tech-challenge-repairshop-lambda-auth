# Quarkus Application Config
quarkus.http.port=8085
quarkus.application.name=tech-challenge-repairshop-lambda-auth

# Habilita o servidor REST convencional e Swagger UI em modo dev
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# Configuração da extensão quarkus-amazon-lambda-http para aceitar requisições locais
quarkus.lambda.handler=quarkus
%dev.quarkus.amazon-lambda.poll-for-tasks=false

# SmallRye JWT Verification Config
mp.jwt.verify.issuer=https://repairshop.auth.com
mp.jwt.verify.publickey.location=publicKey.pem

# SmallRye JWT Signing Config
smallrye.jwt.new-token.issuer=https://repairshop.auth.com
smallrye.jwt.new-token.lifespan=86400
smallrye.jwt.sign.key.location=privateKey.pem

# Quarkus PostgreSQL Datasource Config (Dev / Prod)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/repairshop}
quarkus.datasource.username=${DB_USERNAME:repairshop}
quarkus.datasource.password=${DB_PASSWORD:repairshop}

# Agroal Connection Pool Otimizado para AWS Lambda Serverless
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.jdbc.idle-removal-interval=30s

# Hibernate ORM Config
quarkus.hibernate-orm.database.generation=validate

# Profile %test Config (Execução de testes isolados em memória com H2)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
